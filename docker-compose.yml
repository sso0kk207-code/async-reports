services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/reports
      CELERY_BROKER_URL: redis://redis:6379/0
      REPORTS_DIR: /srv/reports_out
    volumes: [reports:/srv/reports_out]    # общий том: воркер пишет файлы, API их отдаёт
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment: *env
    volumes: [reports:/srv/reports_out]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: reports
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reports"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
  reports:
